<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%235b4bff%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2218%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
<title>SiteMix</title>
</head>
<body data-page="builder" data-title="nav_builder">
<header id="site-header"></header>
<main class="builder">
  <aside class="panel" id="panel">
    <div class="panel-top"><h1 data-i18n="b_title"></h1><span class="saved" id="saved" data-i18n="b_saved"></span></div>

    <details class="grp" open><summary data-i18n="b_g_tpl"></summary><div class="grp-body">
      <div class="fld"><span>🖥️ <span data-i18n="b_desktop_tpl"></span></span><div class="tpl-pick" id="pick-d"></div></div>
      <div class="fld"><span>📱 <span data-i18n="b_mobile_tpl"></span></span><div class="tpl-pick" id="pick-m"></div></div>
      <div class="hint" data-i18n="b_tpl_hint"></div>
      <a class="btn ghost sm" href="templates.html" data-i18n="b_browse_all"></a>
      <div class="row2"><select id="sample-cat" class="lang-select" style="width:100%"></select><button class="btn ghost sm" id="load-sample" type="button" data-i18n="b_load_sample"></button></div>
    </div></details>

    <details class="grp" open><summary data-i18n="b_g_content"></summary><div class="grp-body">
      <label class="fld"><span data-i18n="b_name"></span><input type="text" data-k="name" maxlength="80"></label>
      <div class="row2">
        <label class="fld"><span data-i18n="b_logo"></span><input type="text" data-k="logo" maxlength="30"></label>
        <label class="fld"><span data-i18n="b_emoji"></span><input type="text" data-k="emoji" maxlength="8"></label>
      </div>
      <label class="fld"><span data-i18n="b_tagline"></span><input type="text" data-k="tagline" maxlength="160"></label>
      <label class="fld"><span data-i18n="b_about"></span><textarea data-k="about"></textarea></label>
      <label class="fld"><span data-i18n="b_services"></span><textarea data-k="services" rows="4"></textarea><small class="muted" data-i18n="b_services_hint"></small></label>
    </div></details>

    <details class="grp" open><summary data-i18n="b_g_colors"></summary><div class="grp-body">
      <div class="row2">
        <label class="fld"><span data-i18n="b_primary"></span><div class="color-row"><input type="color" data-k="primary"><input type="text" data-k="primary" maxlength="9" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:9px"></div></label>
        <label class="fld"><span data-i18n="b_accent"></span><div class="color-row"><input type="color" data-k="accent"><input type="text" data-k="accent" maxlength="9" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:9px"></div></label>
      </div>
    </div></details>

    <details class="grp" open><summary data-i18n="b_g_plugins"></summary><div class="grp-body">
      <input type="search" id="plugin-search" class="psearch" data-i18n-ph="b_plugin_search">
      <div class="pg-tabs" id="pg-tabs"></div>
      <div id="plugins" class="plist"></div>
    </div></details>

    <details class="grp" open id="grp-shop"><summary>🛍️ <span data-i18n="b_g_shop"></span></summary><div class="grp-body">
      <label class="fld"><span data-i18n="b_currency"></span><input type="text" data-k="currency" maxlength="6"></label>
      <div id="products" style="display:grid;gap:10px"></div>
      <button class="btn ghost sm" type="button" id="add-prod">＋ <span data-i18n="b_add_product"></span></button>
      <label class="fld"><span data-i18n="b_paypalme"></span><input type="text" data-k="paypalMe" placeholder="paypal.me/yourname"></label>
      <div class="hint pay" data-i18n="b_hint_pay"></div>
    </div></details>


    <details class="grp" open><summary data-i18n="b_g_contact"></summary><div class="grp-body">
      <label class="fld"><span data-i18n="b_wa"></span><input type="tel" data-k="wa" placeholder="85291234567"></label>
      <label class="fld"><span data-i18n="b_email"></span><input type="email" data-k="email" placeholder="shop@example.com"></label>
      <div class="hint" data-i18n="b_contact_hint"></div>
    </div></details>

    <details class="grp" id="grp-seo"><summary data-i18n="b_g_seo"></summary><div class="grp-body">
      <label class="fld"><span data-i18n="b_seo_title"></span><input type="text" data-k="seo.title" maxlength="70"></label>
      <label class="fld"><span data-i18n="b_seo_desc"></span><textarea data-k="seo.desc" maxlength="170"></textarea></label>
      <label class="fld"><span data-i18n="b_seo_kw"></span><input type="text" data-k="seo.kw"></label>
      <label class="fld"><span data-i18n="b_seo_og"></span><input type="url" data-k="seo.og" placeholder="https://..."></label>
      <label class="fld"><span data-i18n="b_seo_url"></span><input type="url" data-k="seo.url" placeholder="https://www.your-domain.com/"></label>
    </div></details>

    <details class="grp" id="grp-analytics"><summary data-i18n="b_g_analytics"></summary><div class="grp-body">
      <label class="fld"><span data-i18n="b_analytics"></span><textarea data-k="analytics" rows="4" placeholder="&lt;script async src=&quot;https://www.googletagmanager.com/gtag/js?id=G-XXXX&quot;&gt;&lt;/script&gt;"></textarea></label>
      <div class="hint" data-i18n="b_analytics_hint"></div>
    </div></details>

    <details class="grp" id="grp-lang"><summary data-i18n="b_g_langs"></summary><div class="grp-body">
      <label class="fld"><span data-i18n="b_default_lang"></span><select data-k="lang" id="site-lang"></select></label>
      <div class="fld"><span data-i18n="b_site_langs"></span><div class="langs-pick" id="site-langs"></div></div>
      <div class="hint" data-i18n="b_lang_hint"></div>
    </div></details>

    <details class="grp" id="grp-autotr" open><summary>🈯 <span data-i18n="b_g_autotr"></span></summary><div class="grp-body">
      <div class="fld"><span data-i18n="b_tr_mode"></span>
        <label class="toggle"><div><b><input type="radio" name="trmode" value="api"> <span data-i18n="b_tr_api"></span></b><small data-i18n="b_tr_api_d"></small><small id="tr-api-state"></small></div></label>
        <label class="toggle"><div><b><input type="radio" name="trmode" value="widget"> <span data-i18n="b_tr_widget"></span></b><small data-i18n="b_tr_widget_d"></small></div></label>
      </div>
      <div id="tr-api-box" style="display:grid;gap:10px">
        <div class="fld"><span data-i18n="b_tr_langs"></span><input type="search" id="tr-lang-search" class="psearch" data-i18n-ph="b_tr_lang_search"><div class="langs-pick tr-langs" id="tr-langs"></div>
          <div class="row2"><button class="btn ghost sm" type="button" id="tr-all" data-i18n="b_tr_all"></button><button class="btn ghost sm" type="button" id="tr-none" data-i18n="b_tr_none"></button></div></div>
        <button class="btn sm" type="button" id="tr-run" data-i18n="b_tr_run"></button>
        <div class="hint" id="tr-status"></div>
        <div class="fld"><span data-i18n="b_tr_edit"></span><select id="tr-edit-lang"></select><div id="tr-edit" class="tr-edit"></div></div>
      </div>
      <div class="hint" id="tr-widget-box" data-i18n="b_tr_widget_note"></div>
    </div></details>

    <details class="grp" open><summary data-i18n="b_g_publish"></summary><div class="grp-body">
      <div class="hint pay" id="publish-note" data-i18n="b_publish_note"></div>
      <button class="btn block" id="publish" type="button" hidden data-i18n="api_publish"></button>
      <div class="hint" id="publish-result" hidden style="font-size:13px"></div>
      <button class="btn block" id="export" type="button">⬇ <span data-i18n="b_export"></span></button>
      <div class="row2"><button class="btn ghost sm" id="export-json" type="button" data-i18n="b_export_json"></button><label class="btn ghost sm" style="cursor:pointer"><span data-i18n="b_import_json"></span><input type="file" id="import-json" accept="application/json,.json" hidden></label></div>
      <button class="btn ghost sm" id="save-site" type="button">💾 <span data-i18n="b_save_site"></span></button>
      <button class="btn ghost sm" id="reset" type="button" data-i18n="b_reset"></button>
      <a class="hint" href="domain.html" style="text-decoration:none">🔗 <span data-i18n="b_next_domain"></span></a>
    </div></details>
  </aside>

  <section class="stage">
    <div class="stage-bar">
      <div class="tabs" id="view-tabs"><button type="button" class="on" data-v="d">🖥️ <span data-i18n="b_view_desktop"></span></button><button type="button" data-v="m">📱 <span data-i18n="b_view_mobile"></span></button></div>
      <span class="muted" style="font-size:13px" id="combo"></span>
      <button class="btn sm" id="export2" type="button">⬇ <span data-i18n="b_export"></span></button>
    </div>
    <div class="stage-view" id="stage"><div class="frame-wrap" id="fw"><iframe id="preview" title="preview"></iframe></div></div>
  </section>
</main>
<script src="assets/js/config.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/plugins.js"></script>
<script src="assets/js/langs-world.js"></script>
<script src="assets/js/templates.js"></script>
<script src="assets/js/builder.js"></script>
</body>
</html>
