<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%235b4bff%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2218%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="signup" data-title="au_signup_title" data-mode="signup">
<header id="site-header"></header>
<main class="auth-wrap">
  <div class="auth-card">
    <h1 data-i18n="au_signup_title"></h1>
    <p data-i18n="au_signup_sub"></p>
    <div class="sso">
      <button type="button" class="sso-btn google" data-provider="google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.2l7.9 6.2C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.8c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.9 6.2C6.6 42.6 14.6 48 24 48z"/></svg><span data-i18n="au_google"></span></button>
      <button type="button" class="sso-btn facebook" data-provider="facebook"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg><span data-i18n="au_facebook"></span></button>
      <button type="button" class="sso-btn x" data-provider="x"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M18.2 2.3h3.4l-7.4 8.4 8.7 11.5h-6.8l-5.3-7-6.1 7H1.3l7.9-9L.9 2.3h7l4.8 6.4 5.5-6.4zm-1.2 17.9h1.9L7.1 4.2H5.1L17 20.2z"/></svg><span data-i18n="au_x"></span></button>
    </div>
    <div class="or" data-i18n="au_or"></div>
    <form class="auth-form" id="auth-form" novalidate>
      <input name="name" type="text" autocomplete="name" data-i18n-ph="au_name" maxlength="60">
      <input name="email" type="email" autocomplete="email" required data-i18n-ph="au_email">
      <input name="password" type="password" autocomplete="new-password" required minlength="8" data-i18n-ph="au_password">
      <button class="btn block" type="submit" data-i18n="au_signup_btn"></button>
      
    </form>
    <div class="auth-msg" id="auth-msg" role="status" style="margin-top:14px"></div>
    <div class="demo-box" id="demo-box" hidden><b>🧪 <span data-i18n="au_demo_title"></span></b><span data-i18n="au_demo_d"></span><div style="margin-top:10px"><button type="button" class="btn sm" id="demo-btn" data-i18n="au_demo_btn"></button></div></div>
    <p class="auth-alt"><span data-i18n="au_have_acc"></span> <a href="login.html" data-i18n="au_login_link"></a></p>
  </div>
</main>
<script src="assets/js/config.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/auth-page.js"></script>
</body>
</html>
