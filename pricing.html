<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%235b4bff%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2218%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
<title>SiteMix</title>
<style>
.pay-btns{display:grid;gap:8px}
.btn.stripe{background:#635bff;box-shadow:0 6px 18px rgba(99,91,255,.3)}
.btn.paypal{background:#ffc439;color:#111;box-shadow:none}
.pp-box{min-height:0}
.pay-msg{display:none;font-size:13px;line-height:1.45;background:#fffbeb;border:1px dashed #f59e0b;color:#92400e;border-radius:10px;padding:10px 12px}
.pay-msg.on{display:block}
.secure{font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body data-page="pricing" data-title="nav_pricing">
<header id="site-header"></header>
<main>
<section class="page-head"><div class="container"><h1 data-i18n="pr_title"></h1><p data-i18n="pr_sub"></p></div></section>
<section class="sec" style="padding-top:24px">
  <div class="container">
    <p style="text-align:center;margin:0 0 34px"><span class="pill">ⓘ <span data-i18n="pr_monthly_only"></span></span></p>
    <div class="plans" id="plans"></div>
    <p class="ph-note" data-i18n="pr_selfservice" style="margin-top:28px;font-size:14px"></p>
  </div>
</section>
<section class="sec soft" style="padding-top:56px">
  <div class="container">
    <div class="faq">
      <details open><summary data-i18n="pr_faq1_q"></summary><p data-i18n="pr_faq1_a"></p></details>
      <details><summary data-i18n="pr_faq2_q"></summary><p data-i18n="pr_faq2_a"></p></details>
      <details><summary data-i18n="faq2_q"></summary><p data-i18n="faq2_a"></p></details>
    </div>
  </div>
</section>
</main>
<footer id="site-footer"></footer>
<script src="assets/js/config.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/pricing.js"></script>
</body>
</html>
