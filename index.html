<script>
document.addEventListener('sm:ready', function () {
  function mount(el, html, w, h) {
    var f = document.createElement('iframe'); f.setAttribute('tabindex', '-1'); f.setAttribute('aria-hidden', 'true');
    f.style.width = w + 'px'; f.style.height = h + 'px'; f.srcdoc = html; el.appendChild(f);
    function fit() { var s = el.clientWidth / w; f.style.transform = 'scale(' + s + ')'; f.style.height = (el.clientHeight / s) + 'px'; }
    fit(); window.addEventListener('resize', fit);
  }
  function build() {
    var lang = SM.getLang();
    var a = SM_TPL.sampleState('cafe', lang); a.plugins.whatsapp = false; a.plugins.cookie = false; a.plugins.announce = false;
    var b = SM_TPL.sampleState('fashion', lang); b.plugins.cookie = false; b.plugins.announce = false;
    var d = document.getElementById('mock-d'), m = document.getElementById('mock-m');
    d.innerHTML = ''; m.innerHTML = '';
    mount(d, SM_TPL.generateSite(a, { preview: true }), 1280, 800);
    mount(m, SM_TPL.generateSite(b, { preview: true }), 390, 780);
  }
  build();
  document.addEventListener('sm:lang', build);
  document.getElementById('lang-cloud').innerHTML = SM_LANGS.map(function (l) { return '<span>' + l.name + '</span>'; }).join('');
});
</script>
